<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Richiesta inviata - Parti in Bus Calabria</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

            background:
                linear-gradient(
                    rgba(8, 31, 48, 0.65),
                    rgba(8, 31, 48, 0.65)
                ),
                url("https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;

            color: white;
            padding: 20px;
        }

        .conferma {
            max-width: 650px;
            width: 100%;
            background: white;
            color: #17202a;
            padding: 45px 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .icona {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 15px;
            color: #17202a;
        }

        .testo {
            color: #66727d;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .social-titolo {
            color: #17202a;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .social a,
        .home-button {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .instagram {
            background-color: #f47b20;
            color: white;
        }

        .tiktok {
            background-color: #17202a;
            color: white;
        }

        .home-button {
            background-color: white;
            color: #17202a;
            border: 2px solid #17202a;
        }

        .social a:hover,
        .home-button:hover {
            transform: translateY(-3px);
        }

        .instagram:hover {
            background-color: #ff8c2b;
        }

        .tiktok:hover {
            background-color: #263746;
        }

        .home-button:hover {
            background-color: #17202a;
            color: white;
        }

    </style>

</head>

<body>

    <div class="conferma">

        <div class="icona">✅</div>

        <h1>Richiesta inviata!</h1>

        <p class="testo">
            Grazie per averci contattato.<br>
            Abbiamo ricevuto la tua richiesta e ti risponderemo
            il prima possibile.
        </p>

        <p class="social-titolo">
            Nel frattempo, seguici sui nostri social!
        </p>

        <div class="social">

            <a href="https://www.instagram.com/partiinbuscalabria"
               target="_blank"
               class="instagram">
                Instagram
            </a>

            <a href="https://www.tiktok.com/@_.parti.in.bus.calabria_"
               target="_blank"
               class="tiktok">
                TikTok
            </a>

        </div>

        <a href="index.html" class="home-button">
            ← Torna al sito
        </a>

    </div>

</body>

</html>
